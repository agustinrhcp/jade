name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'
          bundler-cache: true
      - run: bundle exec rspec

      - name: A moved public API needs a changelog entry
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin ${{ github.base_ref }}
          script/check_api_changelog.sh origin/${{ github.base_ref }}
